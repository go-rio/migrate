name: Test
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        go: ["stable"]
        platform: [ ubuntu-latest, macos-latest, windows-latest ]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          cache: true
          go-version: ${{ matrix.go }}
      - name: Vet
        run: go vet ./...
      - name: Run tests
        run: go test -race -shuffle=on -timeout 10m ./...
      - name: Run SQLite integration tests
        working-directory: integration
        run: go test -race -shuffle=on -count=1 -timeout 10m ./...
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: migrate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:9.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: migrate_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -uroot -proot --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      clickhouse:
        image: clickhouse/clickhouse-server:26.7-alpine
        env:
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: clickhouse
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
        ports:
          - 9000:9000
        options: >-
          --health-cmd "clickhouse-client --user default --password clickhouse --query 'SELECT 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          cache: true
          go-version: 'stable'
      - name: Run integration tests against Postgres, MySQL, and ClickHouse
        working-directory: integration
        run: go test -race -shuffle=on -count=1 -timeout 10m ./...
        env:
          MIGRATE_POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/migrate_test?sslmode=disable
          MIGRATE_MYSQL_DSN: root:root@tcp(localhost:3306)/migrate_test
          MIGRATE_CLICKHOUSE_DSN: clickhouse://default:clickhouse@localhost:9000/default?dial_timeout=10s
  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          cache: true
          go-version: 'stable'
      - name: Run coverage
        run: |
          go test -coverprofile=cov.out -covermode=atomic ./...
          go tool cover -func=cov.out | tail -1
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          cache: true
          go-version: 'stable'
      - name: Fuzz literal escaping (short)
        run: go test -run=^$ -fuzz=FuzzLiteral -fuzztime=30s .
      - name: Fuzz identifier quoting (short)
        run: go test -run=^$ -fuzz=FuzzQuoterIdent -fuzztime=30s .
      - name: Fuzz parent table inference (short)
        run: go test -run=^$ -fuzz=FuzzGuessParentTable -fuzztime=30s .
